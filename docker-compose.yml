# One command to run the whole thing:  docker compose up --build
# Then open http://localhost:8080
#
# Copy .env.example to .env first. The app refuses to start in the prod profile
# without IP_SALT, which is deliberate — a default salt makes the stored visitor
# hashes trivially reversible.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-portfolio}
      POSTGRES_USER: ${DATABASE_USER:-portfolio}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app must not start migrating before Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-portfolio} -d ${DATABASE_NAME:-portfolio}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published: only the app needs to reach it.
    expose:
      - "5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-portfolio}
      DATABASE_USER: ${DATABASE_USER:-portfolio}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      IP_SALT: ${IP_SALT:?set IP_SALT in .env}
      CONTACT_MAIL_ENABLED: ${CONTACT_MAIL_ENABLED:-false}
      CONTACT_NOTIFY_TO: ${CONTACT_NOTIFY_TO:-prajwalsingh0605@gmail.com}
      CONTACT_FROM: ${CONTACT_FROM:-no-reply@prajwalsingh.dev}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
