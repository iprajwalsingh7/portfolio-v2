# Runs on every push so a broken build is caught here rather than by whoever
# opens the site. Mirrors what Cloudflare Pages runs, plus the tests.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: frontend — build, typecheck, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - run: npm run typecheck
        working-directory: frontend

      # Loads the real built page and the real bundle into jsdom and asserts the
      # things that fail silently in a browser.
      - run: npm run smoke
        working-directory: frontend

  backend:
    name: backend — compile and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The backend serves the frontend from its classpath and reads the same
      # content.json, so the frontend build has to happen first.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend

      - run: mvn -B verify
        working-directory: backend

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
