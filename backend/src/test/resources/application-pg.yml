# Profile for the tests that run against a real Postgres container.
#
# Deliberately does NOT set spring.datasource.* — Testcontainers supplies the
# connection through @ServiceConnection. Flyway is on and ddl-auto is off, so
# these tests exercise V1__init.sql rather than a Hibernate-generated schema:
# the migration is what production actually runs, and until now nothing verified
# it.
spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

portfolio:
  contact:
    mail-enabled: false
    notify-to: test@example.com
  rate-limit:
    capacity: 2
    refill: PT10M
  privacy:
    ip-salt: pg-test-salt

logging:
  level:
    root: WARN
    com.prajwalsingh.portfolio: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
