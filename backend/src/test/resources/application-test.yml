# Test profile: in-memory H2, no mail, deliberately tiny rate limits so the
# limiter can be exercised without sleeping for an hour.
spring:
  datasource:
    # One database per application context. The test classes differ in their
    # configuration (mocked beans, MockMvc), so Spring builds a separate context
    # for each — and with a single shared name plus create-drop, every context
    # refresh would drop the tables the other contexts were still using.
    url: jdbc:h2:mem:portfolio-${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
portfolio:
  contact:
    mail-enabled: false
    notify-to: test@example.com
    from: no-reply@example.com
  rate-limit:
    capacity: 2
    refill: PT10M
  privacy:
    ip-salt: test-salt

logging:
  level:
    root: WARN
    com.prajwalsingh.portfolio: INFO
